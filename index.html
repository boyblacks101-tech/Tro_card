<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tro Card</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
:root{--acc:#8a63c9;--bord:#4c3a6b;--mut:#a78fd4;--dim:#8d84a0;--txt:#ece7f6;--bg:#000;--ws:34px;--ms:19px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',Tahoma,sans-serif;padding:56px 0 40px}
.reminder{position:fixed;top:10px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-style:italic;font-size:19px;color:var(--acc);z-index:5}
#ham{position:fixed;top:8px;left:10px;background:none;border:1px solid var(--bord);border-radius:10px;color:var(--acc);font-size:16px;padding:4px 10px;z-index:6}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:none}
#drawer{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--bg);border-right:1px solid var(--bord);z-index:10;display:none;padding:16px 10px;overflow-y:auto}
.screen{display:none;max-width:560px;margin:0 auto;padding:0 16px}
.title{font-family:Georgia,serif;font-style:italic;text-align:center;color:var(--txt);letter-spacing:1px;font-size:26px}
.btn{display:inline-block;font-size:11px;letter-spacing:2px;color:var(--acc);background:transparent;border:1px solid var(--bord);border-radius:999px;padding:10px 18px;margin:6px 4px;font-family:inherit}
.btn:active{background:#151020}
.btn.big{display:block;width:86%;margin:12px auto;text-align:center;font-size:13px;padding:14px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bord);border-radius:12px;color:var(--txt);font-size:15px;padding:10px 12px;margin:6px 0;font-family:inherit}
input:focus,textarea:focus{border-color:var(--acc);outline:none}
textarea{min-height:64px}
label.f{font-size:10px;letter-spacing:2px;color:var(--dim);display:block;margin-top:12px}
.word{font-family:Georgia,serif;font-style:italic;font-size:var(--ws);color:var(--txt);text-align:center;margin:10px 0;cursor:pointer;letter-spacing:.5px}
.pos{text-align:center;font-size:13px;font-style:italic;color:var(--dim)}
.note{font-size:13px;color:var(--mut);text-align:center;margin:10px 0}
.fa{direction:rtl;font-family:Tahoma,sans-serif;font-size:20px;color:var(--txt);text-align:center;margin:10px 0}
.meaning{font-family:Georgia,serif;font-style:italic;font-size:var(--ms);line-height:1.7;color:var(--txt);text-align:left;margin:14px 2px}
.example{font-style:italic;font-size:15px;line-height:1.8;color:var(--mut);text-align:left;margin:14px 2px}
.cloze{font-style:italic;font-size:17px;line-height:1.8;color:var(--txt);text-align:center;margin:14px 2px}
.blank{color:var(--acc);letter-spacing:2px}
.tag{text-align:center;font-size:10px;letter-spacing:4px;color:var(--dim);margin:12px 0}
.divider{width:56px;height:1px;margin:22px auto;background:var(--bord)}
.hidden{display:none}
.tg{color:#86efac}.tb{color:#fca5a5}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.statcard{border:1px solid var(--bord);border-radius:14px;padding:12px;text-align:center}
.statcard b{display:block;font-size:20px;color:var(--txt);font-family:Georgia,serif}
.statcard span{font-size:10px;letter-spacing:2px;color:var(--dim)}
.ringwrap{text-align:center;margin:6px 0}
.carditem{border:1px solid var(--bord);border-radius:14px;padding:10px 14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.carditem .w{font-family:Georgia,serif;font-style:italic;color:var(--txt);font-size:17px}
.spkbtn{display:block;margin:4px auto;background:none;border:none;color:var(--acc);font-size:17px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin:10px 0}
.chk input{width:auto;margin:0}
.heat{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:14px 0}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--acc);opacity:.08}
.heat i.l1{opacity:.3}.heat i.l2{opacity:.5}.heat i.l3{opacity:.75}.heat i.l4{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chip{border:1px solid var(--bord);border-radius:999px;padding:6px 12px;font-size:11px;color:var(--dim)}
.chip.on{color:var(--acc)}
</style>
</head>
<body>
<div id="ncr" class="reminder"></div>
<button id="ham" onclick="openDrawer()">☰</button>
<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="tag" style="margin-top:34px">TRO CARD</div>
  <button class="btn big" onclick="goHome()">🏠 HOME</button>
  <button class="btn big" onclick="nav('scrBrowse');renderBrowse()">📚 BROWSE</button>
  <button class="btn big" onclick="nav('scrEdit');editCard(null)">＋ ADD CARD</button>
  <button class="btn big" onclick="nav('scrBulk')">⚡ BULK ADD</button>
  <button class="btn big" onclick="nav('scrStats');renderStats()">📊 STATS</button>
  <button class="btn big" onclick="nav('scrSettings');openSettings()">⚙ SETTINGS</button>
</div>

<div id="scrLock" class="screen">
  <div class="tag">🔒 LOCKED</div>
  <input id="pinIn" type="password" inputmode="numeric" placeholder="Enter PIN">
  <div class="row"><button class="btn" onclick="tryUnlock()">UNLOCK</button></div>
</div>

<div id="scrHome" class="screen">
  <h1 class="title">Tro Card</h1>
  <div class="ringwrap"><svg width="120" height="120"><circle cx="60" cy="60" r="52" stroke="var(--bord)" stroke-width="8" fill="none" opacity=".4"/><circle id="ringFg" cx="60" cy="60" r="52" stroke="var(--acc)" stroke-width="8" fill="none" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"/></svg><div id="ringTxt" class="pos"></div></div>
  <div id="wotd" class="statcard" style="margin:10px 0;cursor:pointer" onclick="speakWotd()"></div>
  <div class="statgrid">
    <div class="statcard"><b id="hCards">0</b><span>CARDS</span></div>
    <div class="statcard"><b id="hDue">0</b><span>DUE</span></div>
    <div class="statcard"><b id="hNew">0</b><span>NEW LEFT</span></div>
    <div class="statcard"><b id="hStreak">0</b><span>STREAK 🔥</span></div>
  </div>
  <button class="btn big" onclick="startStudy(false)">▶ STUDY</button>
  <button class="btn big" onclick="startStudy(true)">💪 HARD WORDS</button>
</div>

<div id="scrStudy" class="screen">
  <div id="studyBox"></div>
  <div class="row" style="margin-top:34px"><button class="btn" onclick="goHome()">✕ EXIT</button></div>
</div>

<div id="scrBrowse" class="screen">
  <div class="tag">BROWSE</div>
  <input id="search" placeholder="Search..." oninput="renderBrowse()">
  <div id="browseList"></div>
  <div class="row"><button class="btn" onclick="goHome()">← HOME</button></div>
</div>

<div id="scrEdit" class="screen">
  <div class="tag">CARD EDITOR</div>
  <label class="f">WORD *</label><input id="fFront">
  <label class="f">DEFINITION (EN)</label><textarea id="fBack"></textarea>
  <label class="f">MEANING (FA)</label><input id="fFa" dir="rtl">
  <label class="f">EXAMPLE (EN)</label><textarea id="fEx"></textarea>
  <label class="f">EXAMPLE TRANSLATION (FA)</label><textarea id="fExFa" dir="rtl"></textarea>
  <label class="f">POS</label><input id="fPos" placeholder="noun / verb / both">
  <label class="f">NOTE / MNEMONIC</label><input id="fNote">
  <label class="chk"><input type="checkbox" id="fNoQ2"> Disable EN→FA</label>
  <label class="chk"><input type="checkbox" id="fNoQ3"> Disable FA→EN</label>
  <label class="chk"><input type="checkbox" id="fNoQ4"> Disable Cloze</label>
  <label class="chk"><input type="checkbox" id="fNoQ5"> Disable DEF→WORD</label>
  <div class="row"><button class="btn" onclick="saveCard()">💾 SAVE</button><button class="btn" onclick="show('scrBrowse');renderBrowse()">CANCEL</button></div>
</div>

<div id="scrBulk" class="screen">
  <div class="tag">BULK ADD</div>
  <div class="pos" style="text-align:left">One card per line:<br>word | definition | fa | example | pos | example-fa</div>
  <textarea id="bulkIn" style="min-height:160px"></textarea>
  <div class="row"><button class="btn" onclick="bulkAdd()">⚡ ADD ALL</button><button class="btn" onclick="goHome()">CANCEL</button></div>
</div>

<div id="scrStats" class="screen">
  <div class="tag">STATS</div>
  <div id="statBox"></div>
  <div class="tag">LAST 12 WEEKS</div>
  <div id="heat" class="heat"></div>
  <div class="tag">BADGES</div>
  <div id="chips" class="chips"></div>
  <div class="row"><button class="btn" onclick="goHome()">← HOME</button></div>
</div>

<div id="scrSettings" class="screen">
  <div class="tag">SETTINGS</div>
  <label class="f">REMINDER TEXT (TOP)</label><input id="sNcr">
  <label class="f">THEME</label>
  <select id="sTheme"><option value="purple">Midnight Purple</option><option value="ocean">Ocean</option><option value="blood">Blood</option><option value="forest">Forest</option><option value="gold">Gold</option><option value="mono">Mono</option><option value="sakura">Sakura</option></select>
  <label class="f">FONT SIZE</label>
  <select id="sFs"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select>
  <label class="f">SESSION SIZE</label>
  <select id="sSess"><option value="10">10 cards</option><option value="20">20 cards</option><option value="0">All</option></select>
  <label class="f">SPEECH SPEED</label>
  <select id="sRate"><option value="0.7">Slow</option><option value="0.85">Normal</option><option value="1">Fast</option></select>
  <label class="f">NEW CARDS PER DAY</label><input id="sNew" type="number">
  <label class="chk"><input type="checkbox" id="sAuto"> Auto-speak word on card open</label>
  <label class="f">SET / CHANGE PIN (empty = keep)</label><input id="sPin" type="password" inputmode="numeric">
  <div class="row"><button class="btn" onclick="saveSettings()">💾 SAVE</button><button class="btn" onclick="clearPin()">REMOVE PIN</button></div>
  <div class="divider"></div>
  <div class="row"><button class="btn" onclick="exportJSON()">⬇ BACKUP</button><label class="btn">⬆ RESTORE<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label></div>
  <div class="row"><button class="btn" onclick="goHome()">← HOME</button></div>
</div>

<script>
let cards=[],set={},queue=[],qi=0,editId=null,unlocked=false,hardMode=false,wotdWord='';
const $=id=>document.getElementById(id);
const LS='tro1';
const DEF={ncr:'',pin:'',newPerDay:10,newUsed:{d:'',n:0},autoSpeak:false,theme:'purple',fs:'m',sess:10,rate:0.85,st:{rev:0,cor:0,xp:0,streak:0,best:0,last:'',days:{}}};
const THEMES={
purple:{acc:'#8a63c9',bord:'#4c3a6b',mut:'#a78fd4',dim:'#8d84a0',txt:'#ece7f6',bg:'#000000'},
ocean:{acc:'#58a6d6',bord:'#2b4d66',mut:'#8fc3e0',dim:'#849aa8',txt:'#e7f1f7',bg:'#000408'},
blood:{acc:'#d66a6a',bord:'#662b2b',mut:'#e09a9a',dim:'#a88484',txt:'#f7e7e7',bg:'#080000'},
forest:{acc:'#66d69a',bord:'#2b6647',mut:'#9ae0bb',dim:'#84a894',txt:'#e7f7ee',bg:'#000804'},
gold:{acc:'#d6b458',bord:'#66512b',mut:'#e0c48f',dim:'#a89a84',txt:'#f7f0e7',bg:'#080500'},
mono:{acc:'#cccccc',bord:'#4c4c4c',mut:'#b8b8b8',dim:'#909090',txt:'#f2f2f2',bg:'#000000'},
sakura:{acc:'#e08bc0',bord:'#6b3a5a',mut:'#e8aed4',dim:'#a8849a',txt:'#f7e7f1',bg:'#080005'}};
const FS={s:['28px','17px'],m:['34px','19px'],l:['40px','22px']};
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');cards=d.cards||[];set=Object.assign(JSON.parse(JSON.stringify(DEF)),d.set||{});set.st=Object.assign({rev:0,cor:0,xp:0,streak:0,best:0,last:'',days:{}},d.set&&d.set.st||{});}catch(e){cards=[];set=JSON.parse(JSON.stringify(DEF));}}
function save(){localStorage.setItem(LS,JSON.stringify({cards,set}));}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function today(){return new Date().toDateString();}
function usedToday(){return (set.newUsed&&set.newUsed.d===today())?set.newUsed.n:0;}
function bumpNew(){if(!set.newUsed||set.newUsed.d!==today())set.newUsed={d:today(),n:0};set.newUsed.n++;}
function newSrs(){return {reps:0,ease:2.5,interval:0,due:0,lapses:0};}
function genId(){return 'c'+Date.now()+Math.random().toString(36).slice(2,6);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.style.display='none');$(id).style.display='block';window.scrollTo(0,0);}
function goHome(){closeDrawer();show('scrHome');refreshHome();}
function nav(id){closeDrawer();show(id);}
function openDrawer(){$('drawer').style.display='block';$('overlay').style.display='block';}
function closeDrawer(){$('drawer').style.display='none';$('overlay').style.display='none';}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=parseFloat(set.rate)||0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function speakWotd(){if(wotdWord)speak(wotdWord);}
function applyTheme(){const t=THEMES[set.theme]||THEMES.purple;const r=document.documentElement.style;
r.setProperty('--acc',t.acc);r.setProperty('--bord',t.bord);r.setProperty('--mut',t.mut);r.setProperty('--dim',t.dim);r.setProperty('--txt',t.txt);r.setProperty('--bg',t.bg);
const f=FS[set.fs]||FS.m;r.setProperty('--ws',f[0]);r.setProperty('--ms',f[1]);}
function disabled(c,q){
if(q==='q2')return c.noQ2||!c.fa;
if(q==='q3')return c.noQ3||!c.fa;
if(q==='q4')return c.noQ4||!c.example||!c.exFa;
if(q==='q5')return c.noQ5||!c.back;
return false;}
function hardOf(c){let l=0;['q1','q2','q3','q4','q5'].forEach(q=>{if(c.srs[q])l+=c.srs[q].lapses;});return l>=3;}
function dueCount(){const now=Date.now();let n=0;cards.forEach(c=>{['q1','q2','q3','q4','q5'].forEach(q=>{if(disabled(c,q)||!c.srs[q])return;const s=c.srs[q];const isNew=s.reps===0&&s.interval===0&&s.lapses===0;if(!isNew&&s.due<=now)n++;});});return n;}
function doneToday(){return (set.st.days&&set.st.days[today()])||0;}
function refreshHome(){
$('hCards').textContent=cards.length;$('hDue').textContent=dueCount();$('hNew').textContent=Math.max(0,set.newPerDay-usedToday());$('hStreak').textContent=set.st.streak;
const d=doneToday(),due=dueCount();const p=(d+due)?d/(d+due):0;
$('ringFg').setAttribute('stroke-dashoffset',326.7*(1-p));
$('ringTxt').textContent=d+' done today';
if(cards.length){const c=cards[Math.floor(Date.now()/86400000)%cards.length];wotdWord=c.front;
$('wotd').innerHTML='<span>WORD OF THE DAY 🔊</span><b style="font-style:italic">'+esc(c.front)+'</b>';}
else $('wotd').innerHTML='<span>WORD OF THE DAY</span><b>—</b>';}
function boot(){load();applyTheme();$('ncr').textContent=set.ncr||'';if(set.pin&&!unlocked){show('scrLock');}else{goHome();}}
function tryUnlock(){if($('pinIn').value===set.pin){unlocked=true;goHome();}else{alert('Wrong PIN');}}
function startStudy(hard){hardMode=!!hard;const now=Date.now();let nl=Math.max(0,set.newPerDay-usedToday());queue=[];
cards.forEach(c=>{if(hardMode&&!hardOf(c))return;
['q1','q2','q3','q4','q5'].forEach(q=>{if(disabled(c,q)||!c.srs[q])return;const s=c.srs[q];const isNew=s.reps===0&&s.interval===0&&s.lapses===0;
if(hardMode){queue.push({c:c,q:q,isNew:false});return;}
if(isNew){if(nl>0){queue.push({c:c,q:q,isNew:true});nl--;}}else if(s.due<=now){queue.push({c:c,q:q,isNew:false});}});});
queue.sort(()=>Math.random()-.5);
const sess=parseInt(set.sess)||0;if(sess>0)queue=queue.slice(0,sess);
if(!queue.length){alert(hardMode?'No hard words yet 🎉':'Nothing due right now 🎉');return;}
qi=0;show('scrStudy');renderStudy();}
function gradeHTML(){return '<div class="divider"></div><div class="row"><button class="btn" onclick="gradeIt(0)">AGAIN</button><button class="btn" onclick="gradeIt(1)">GOOD</button><button class="btn" onclick="gradeIt(2)">EASY</button></div>';}
function cloze(sent,word){try{const re=new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');return sent.replace(re,'<span class="blank">＿＿＿</span>');}catch(e){return sent;}}
function renderStudy(){
if(qi>=queue.length){$('studyBox').innerHTML='<div class="tag">DONE</div><div class="word">All finished! 🎉</div>';return;}
const it=queue[qi],c=it.c;let h='';
if(it.q==='q1'){
h='<div class="tag">WORD</div><div class="word" data-w="'+esc(c.front)+'" onclick="speak(this.dataset.w)">'+esc(c.front)+'</div><button class="spkbtn" onclick="speak(\''+esc(c.front)+'\')">🔊</button>'+(c.pos?'<div class="pos">'+esc(c.pos)+'</div>':'')+'<div class="row"><button class="btn" onclick="revealQ()">REVEAL ➜</button></div><div id="rev" class="hidden"><div class="divider"></div><div class="meaning">'+esc(c.back)+'</div>'+(c.fa?'<div class="fa">'+esc(c.fa)+'</div>':'')+(c.note?'<div class="note">📝 '+esc(c.note)+'</div>':'')+(c.example?'<div class="example">"'+esc(c.example)+'"</div>':'')+'</div><div id="grade" class="hidden">'+gradeHTML()+'</div>';
}else if(it.q==='q2'){
h='<div class="tag">TYPE • EN → FA</div><div class="word" data-w="'+esc(c.front)+'" onclick="speak(this.dataset.w)">'+esc(c.front)+'</div><button class="spkbtn" onclick="speak(\''+esc(c.front)+'\')">🔊</button><input id="ans" placeholder="Type the meaning in Persian..." autocomplete="off"><div class="row"><button class="btn" onclick="checkQ(\'fa\')">CHECK ➜</button></div><div id="rev" class="hidden"></div><div id="grade" class="hidden">'+gradeHTML()+'</div>';
}else if(it.q==='q3'){
h='<div class="tag">TYPE • FA → EN</div><div class="fa" style="font-size:24px">'+esc(c.fa)+'</div><input id="ans" placeholder="Type the English word..." autocomplete="off"><div class="row"><button class="btn" onclick="checkQ(\'front\')">CHECK ➜</button></div><div id="rev" class="hidden"></div><div id="grade" class="hidden">'+gradeHTML()+'</div>';
}else if(it.q==='q4'){
h='<div class="tag">CLOZE • FILL + TRANSLATE</div><div class="cloze">"'+cloze(esc(c.example),esc(c.front))+'"</div><input id="ansW" placeholder="Type the missing word..." autocomplete="off"><input id="ansT" dir="rtl" placeholder="ترجمه جمله رو تایپ کن..." autocomplete="off"><div class="row"><button class="btn" onclick="checkCloze()">CHECK ➜</button></div><div id="rev" class="hidden"></div><div id="grade" class="hidden">'+gradeHTML()+'</div>';
}else{
h='<div class="tag">TYPE • DEF → WORD</div><div class="meaning" style="text-align:center">'+esc(c.back)+'</div><input id="ans" placeholder="Type the word..." autocomplete="off"><div class="row"><button class="btn" onclick="checkQ(\'front\')">CHECK ➜</button></div><div id="rev" class="hidden"></div><div id="grade" class="hidden">'+gradeHTML()+'</div>';
}
$('studyBox').innerHTML=h;
if(set.autoSpeak&&(it.q==='q1'||it.q==='q2'))speak(c.front);}
function revealQ(){$('rev').classList.remove('hidden');$('grade').classList.remove('hidden');}
function diffHTML(typed,correct){const tw=typed.trim().split(/\s+/).filter(x=>x);const cw=correct.trim().toLowerCase().split(/\s+/).filter(x=>x);
return tw.map(w=>'<span class="'+(cw.includes(w.toLowerCase())?'tg':'tb')+'">'+esc(w)+'</span>').join(' ');}
function checkQ(field){const c=queue[qi].c;const typed=$('ans').value;const correct=c[field]||'';
const ok=typed.trim().toLowerCase()===correct.trim().toLowerCase();
$('rev').innerHTML='<div class="divider"></div><div class="tag">'+(ok?'✅ PERFECT':'❌ NOT QUITE')+'</div><div class="meaning" style="text-align:center">'+(diffHTML(typed,correct)||'<span class="tb">(empty)</span>')+'</div><div class="meaning">✔ '+esc(correct)+'</div>'+(c.note?'<div class="note">📝 '+esc(c.note)+'</div>':'');
$('rev').classList.remove('hidden');$('grade').classList.remove('hidden');}
function checkCloze(){const c=queue[qi].c;const w=$('ansW').value,t=$('ansT').value;
const okW=w.trim().toLowerCase()===c.front.trim().toLowerCase();
$('rev').innerHTML='<div class="divider"></div><div class="tag">'+(okW?'✅ WORD PERFECT':'❌ WORD: '+esc(c.front))+'</div><div class="meaning" style="text-align:center">'+(diffHTML(t,c.exFa)||'<span class="tb">(empty)</span>')+'</div><div class="fa">✔ '+esc(c.exFa)+'</div>';
$('rev').classList.remove('hidden');$('grade').classList.remove('hidden');}
function touchStreak(){const t=today();const y=new Date(Date.now()-86400000).toDateString();
if(set.st.last!==t){set.st.streak=(set.st.last===y)?set.st.streak+1:1;set.st.last=t;set.st.best=Math.max(set.st.best,set.st.streak);}}
function gradeIt(g){const it=queue[qi];if(!it.c.srs[it.q])it.c.srs[it.q]=newSrs();const s=it.c.srs[it.q];
if(it.isNew)bumpNew();
set.st.rev++;if(g>0)set.st.cor++;set.st.xp+=g===2?10:(g===1?5:0);touchStreak();
if(!set.st.days)set.st.days={};set.st.days[today()]=(set.st.days[today()]||0)+1;
if(g===0){s.reps=0;s.interval=0;s.due=Date.now()+600000;s.lapses++;
if((it.re||0)<2){it.re=(it.re||0)+1;queue.push(it);}}
else if(g===1){s.interval=s.reps===0?1:(s.reps===1?3:Math.max(s.interval+1,Math.round(s.interval*s.ease)));s.reps++;s.due=Date.now()+s.interval*86400000;}
else{s.interval=s.reps===0?4:Math.round(s.interval*s.ease*1.3);s.reps++;s.due=Date.now()+s.interval*86400000;}
save();qi++;renderStudy();}
function renderBrowse(){const q=($('search').value||'').toLowerCase();const list=cards.filter(c=>c.front.toLowerCase().includes(q));
$('browseList').innerHTML=list.map(c=>'<div class="carditem"><span class="w">'+esc(c.front)+(hardOf(c)?' 💪':'')+'</span><span><button class="btn" onclick="editCard(\''+c.id+'\')">EDIT</button><button class="btn" onclick="delCard(\''+c.id+'\')">✕</button></span></div>').join('')||'<div class="pos">No cards yet</div>';}
function editCard(id){editId=id;const c=id?cards.find(x=>x.id===id):null;
$('fFront').value=c?c.front:'';$('fBack').value=c?c.back:'';$('fFa').value=c?c.fa:'';$('fEx').value=c?c.example:'';$('fExFa').value=c?c.exFa:'';$('fPos').value=c?c.pos:'';$('fNote').value=c?c.note:'';
$('fNoQ2').checked=c?!!c.noQ2:false;$('fNoQ3').checked=c?!!c.noQ3:false;$('fNoQ4').checked=c?!!c.noQ4:false;$('fNoQ5').checked=c?!!c.noQ5:false;show('scrEdit');}
function saveCard(){const v=id=>$(id).value.trim();
if(!v('fFront')){alert('Word is required');return;}
let c=editId?cards.find(x=>x.id===editId):null;
if(!c){c={id:genId(),srs:{q1:newSrs(),q2:newSrs(),q3:newSrs(),q4:newSrs(),q5:newSrs()}};cards.push(c);}
c.front=v('fFront');c.back=v('fBack');c.fa=v('fFa');c.example=v('fEx');c.exFa=v('fExFa');c.pos=v('fPos');c.note=v('fNote');
c.noQ2=$('fNoQ2').checked;c.noQ3=$('fNoQ3').checked;c.noQ4=$('fNoQ4').checked;c.noQ5=$('fNoQ5').checked;
save();show('scrBrowse');renderBrowse();}
function delCard(id){if(confirm('Delete this card?')){cards=cards.filter(c=>c.id!==id);save();renderBrowse();}}
function bulkAdd(){const lines=$('bulkIn').value.split('\n').map(l=>l.trim()).filter(l=>l);let n=0;
lines.forEach(l=>{const p=l.split('|').map(x=>x.trim());if(!p[0])return;
cards.push({id:genId(),front:p[0],back:p[1]||'',fa:p[2]||'',example:p[3]||'',pos:p[4]||'',exFa:p[5]||'',note:'',noQ2:false,noQ3:false,noQ4:false,noQ5:false,srs:{q1:newSrs(),q2:newSrs(),q3:newSrs(),q4:newSrs(),q5:newSrs()}});n++;});
save();alert(n+' cards added ✔');show('scrBrowse');renderBrowse();}
function renderStats(){const s=set.st;const acc=s.rev?Math.round(s.cor/s.rev*100):0;
$('statBox').innerHTML='<div class="meaning">🔁 Reviews: '+s.rev+'</div><div class="meaning">🎯 Accuracy: '+acc+'%</div><div class="meaning">🏆 XP: '+s.xp+' — LVL '+(Math.floor(s.xp/100)+1)+'</div><div class="meaning">🔥 Streak: '+s.streak+' (best '+s.best+')</div><div class="meaning">💪 Hard words: '+cards.filter(hardOf).length+'</div>';
let hh='';for(let i=83;i>=0;i--){const d=new Date(Date.now()-i*86400000).toDateString();const n=(s.days&&s.days[d])||0;const l=n===0?0:(n<3?1:(n<6?2:(n<10?3:4)));hh+='<i class="l'+l+'"></i>';}
$('heat').innerHTML=hh;
const B=[['🌱 First Step',s.rev>=1],['📚 Collector',cards.length>=25],['🔥 Week Flame',s.best>=7],['💯 Reviewer',s.rev>=100],['🏆 LVL 5',s.xp>=400],['💪 Slayer',cards.some(c=>hardOf(c)&&c.srs.q1.interval>=3)]];
$('chips').innerHTML=B.map(b=>'<span class="chip'+(b[1]?' on':'')+'">'+b[0]+'</span>').join('');
show('scrStats');}
function openSettings(){$('sNcr').value=set.ncr||'';$('sNew').value=set.newPerDay||10;$('sTheme').value=set.theme||'purple';$('sFs').value=set.fs||'m';$('sSess').value=String(set.sess==null?10:set.sess);$('sRate').value=String(set.rate||0.85);$('sAuto').checked=!!set.autoSpeak;$('sPin').value='';}
function saveSettings(){set.ncr=$('sNcr').value.trim();set.newPerDay=parseInt($('sNew').value)||10;set.theme=$('sTheme').value;set.fs=$('sFs').value;set.sess=parseInt($('sSess').value)||0;set.rate=parseFloat($('sRate').value)||0.85;set.autoSpeak=$('sAuto').checked;const p=$('sPin').value.trim();if(p)set.pin=p;save();applyTheme();$('ncr').textContent=set.ncr;alert('Saved ✔');goHome();}
function clearPin(){set.pin='';save();alert('PIN removed');}
function exportJSON(){const blob=new Blob([JSON.stringify({cards:cards,set:set},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trocard-backup.json';a.click();}
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.cards){cards=d.cards;if(d.set)set=Object.assign(set,d.set);save();alert('Imported ✔');boot();}}catch(e){alert('Bad file');}};r.readAsText(f);}
boot();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
